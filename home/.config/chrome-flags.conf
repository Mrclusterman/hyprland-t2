# Wayland nativo: scroll suave y gestos del trackpad (pinch-zoom, 2 dedos atrás/adelante)
--ozone-platform-hint=auto
# Un solo --enable-features (Chrome solo usa el último): gestos + vídeo por GPU (VA-API, driver iHD) = menos CPU y batería
--enable-features=TouchpadOverscrollHistoryNavigation,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder
