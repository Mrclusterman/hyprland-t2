# Spotlight (SUPER+Espacio): lanzador centrado arriba, estilo macOS Tahoe, cristal claro (desenfoque: layer rule de Hyprland)
[main]
font=Adwaita Sans:size=15
terminal=kitty
prompt="   "
placeholder=Búsqueda Spotlight
icon-theme=Adwaita
icons-enabled=yes
match-mode=fuzzy
layer=overlay
anchor=top
y-margin=160
width=46
lines=7
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=30
# on-demand: clic en otra ventana o cambiar el foco lo cierra (como Spotlight)
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=f5f5f880
text=1c1c1eff
prompt=6e6e73ff
placeholder=6e6e73ff
input=000000ff
match=000000ff
selection=0a84ffff
selection-text=ffffffff
selection-match=000000ff
border=ffffffb3

[border]
width=1
radius=18
