# Spotlight (SUPER+Espacio): lanzador centrado arriba, estilo macOS, sin blur
[main]
font=Adwaita Sans:size=15
terminal=kitty
prompt="   "
placeholder=Búsqueda Spotlight
icon-theme=Adwaita
icons-enabled=yes
match-mode=fuzzy
layer=overlay
anchor=top
y-margin=160
width=46
lines=7
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=30
# on-demand: clic en otra ventana o cambiar el foco lo cierra (como Spotlight)
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e22f2
text=e5e5eaff
prompt=8e8e93ff
placeholder=8e8e93ff
input=ffffffff
match=ffffffff
selection=0a84ffff
selection-text=ffffffff
selection-match=ffffffff
border=ffffff26

[border]
width=1
radius=14
