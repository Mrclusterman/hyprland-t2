# Al suspender se apaga la pantalla y al volver se enciende cuando el teclado T2 ya responde
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = ~/.local/bin/sleep-screen
    after_sleep_cmd = ~/.local/bin/resume-screen
}

# -d acpi_video0: sin él brightnessctl atenúa la Touch Bar rota
listener {
    timeout = 150
    on-timeout = brightnessctl -d acpi_video0 -s set 10%
    on-resume = brightnessctl -d acpi_video0 -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Suspender tras 15 min sin uso (antes se bloquea a los 5)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
