# Bloqueo estilo macOS, sin blur (rendimiento)
general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/mrclusterman/.local/share/wallpapers/spiderman.jpg
    blur_passes = 0
    brightness = 0.8
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %-d de %B"
    font_size = 20
    font_family = Adwaita Sans Semibold
    color = rgba(255, 255, 255, 0.85)
    position = 0, -110
    halign = center
    valign = top
}

# Hora grande
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = Adwaita Sans Bold
    color = rgba(255, 255, 255, 0.92)
    position = 0, -150
    halign = center
    valign = top
}

# Usuario
label {
    monitor =
    text = $USER
    font_size = 15
    font_family = Adwaita Sans Semibold
    color = rgb(255, 255, 255)
    position = 0, 150
    halign = center
    valign = bottom
}

# Campo de contraseña tipo píldora
input-field {
    monitor =
    size = 240, 38
    rounding = -1
    outline_thickness = 0
    dots_size = 0.22
    dots_spacing = 0.35
    inner_color = rgba(255, 255, 255, 0.22)
    font_color = rgb(255, 255, 255)
    check_color = rgba(255, 255, 255, 0.35)
    fail_color = rgba(255, 69, 58, 0.55)
    fail_text = Contraseña incorrecta
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Introduce la contraseña</span>
    position = 0, 95
    halign = center
    valign = bottom
}
