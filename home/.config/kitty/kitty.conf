# kitty · terminal para programar (tema a juego con Hyprland Spider-Man)

font_family      JetBrainsMono Nerd Font
font_size        12.0
disable_ligatures cursor

# Rendimiento: sin efectos, render solo cuando hace falta
sync_to_monitor     yes
repaint_delay       8
input_delay         2
cursor_blink_interval 0
enable_audio_bell   no
background_opacity  1.0

window_padding_width 8
confirm_os_window_close 0
scrollback_lines    20000
copy_on_select      clipboard
strip_trailing_spaces smart
shell_integration   enabled
allow_remote_control socket-only
listen_on unix:@kitty

# Pestañas
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
enabled_layouts     splits,stack

# Atajos (Super lo usa Hyprland; el resto de kitty por defecto sigue con ctrl+shift)
map ctrl+c          copy_or_interrupt
map ctrl+v          paste_from_clipboard
map ctrl+shift+t    new_tab_with_cwd
map ctrl+alt+d      launch --location=vsplit --cwd=current
map ctrl+alt+e      launch --location=hsplit --cwd=current
map ctrl+alt+k      clear_terminal to_cursor active

# Colores
foreground            #e6e6f0
background            #0b0c1e
selection_foreground  #ffffff
selection_background  #2a4bd7
cursor                #e23636
cursor_text_color     #0b0c1e
url_color             #5c7cfa
active_border_color   #e23636
inactive_border_color #2a2f5a
active_tab_foreground   #ffffff
active_tab_background   #e23636
inactive_tab_foreground #8b90b8
inactive_tab_background #15173a
tab_bar_background      #0b0c1e

