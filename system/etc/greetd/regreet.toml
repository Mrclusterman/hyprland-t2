[background]
path = "/usr/share/backgrounds/spiderman.jpg"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
cursor_blink = false
font_name = "Adwaita Sans 13"
icon_theme_name = "Adwaita"
theme_name = "Adwaita"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[appearance]
greeting_msg = "Bienvenido, Spider-Man"

[widget.clock]
format = "%A %d %B  %H:%M"
resolution = "1s"
label_width = 320
